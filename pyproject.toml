[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chatBot-python"
version = "1.0.0"
description = "Chat bot implemented in Python"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.2",
    "nltk==3.8.1",
    "numpy==1.26.4",
    "pandas==2.2.0",
    "pyarrow==15.0.0",
    "prettytable==3.9.0",
    "joblib==1.3.2",
    "requests==2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
